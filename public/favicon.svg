<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0D9" />
      <stop offset="35%" stop-color="#E8C986" />
      <stop offset="70%" stop-color="#DFB76C" />
      <stop offset="100%" stop-color="#A67B2E" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C986" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A67B2E" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Deep Navy Background with Rounded Corners -->
  <rect width="64" height="64" rx="14" fill="#13152C" />
  
  <!-- Subtle Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" />
  
  <!-- Elegant Golden Monogram 'K' -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Times New Roman', 'Georgia', serif" 
    font-size="40" 
    font-weight="700" 
    fill="url(#goldGradient)"
    style="font-feature-settings: 'liga' 1;"
  >K</text>
</svg>